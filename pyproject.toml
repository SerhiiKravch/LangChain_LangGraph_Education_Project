[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "support-agent"
version = "0.1.0"
description = "Educational AI support inbox agent built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sergiy Kravchyshyn" },
]
dependencies = [
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.uv]
package = true
